[workspace]
members = [".", "overgraph-node", "overgraph-python"]

[package]
name = "overgraph"
version = "0.18.0"
edition = "2021"
description = "An absurdly fast embedded graph database. Pure Rust, sub-microsecond reads."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bhensley5/overgraph"
homepage = "https://overgraph.io"
readme = "README.md"
keywords = ["graph-database", "embedded", "performance", "in-process", "rust"]
categories = ["database-implementations", "data-structures"]

[dependencies]
arc-swap = "1"
crc32fast = "1"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rmp-serde = "1"
crossbeam-skiplist = { version = "=0.1.3", optional = true }
crossbeam-epoch = { version = "=0.9.18", optional = true }

[features]
default = ["production-concurrency"]
cli = []
binding-test-hooks = ["production-concurrency"]
production-concurrency = ["dep:crossbeam-skiplist", "dep:crossbeam-epoch"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[example]]
name = "primary_scale_validation"
path = "examples/rust/id_radix_scale_validation.rs"
required-features = ["production-concurrency"]

[[bin]]
name = "overgraph-inspect"
path = "src/bin/inspect.rs"
required-features = ["cli"]

[[bin]]
name = "overgraph-scrub"
path = "src/bin/scrub.rs"
required-features = ["cli"]

[[bin]]
name = "benchmark-harness"
path = "src/bin/benchmark_harness.rs"
required-features = ["cli"]

[[test]]
name = "inspect_integration"
required-features = ["cli"]

[[test]]
name = "scrub_cli_integration"
required-features = ["cli"]

[[example]]
name = "knowledge_graph"
path = "examples/rust/knowledge_graph.rs"

[[example]]
name = "gql_readonly"
path = "examples/rust/gql_readonly.rs"

[[example]]
name = "primary_index_validation"
path = "examples/rust/id_primary_experiment.rs"
required-features = ["production-concurrency"]

[[bench]]
name = "core_ops"
harness = false

[[bench]]
name = "query_ops"
harness = false

[[bench]]
name = "vector_ops"
harness = false

[[bench]]
name = "async_flush"
harness = false

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

[[example]]
name = "primary_history_snapshot_validation"
path = "examples/rust/id_history_snapshot_diagnostic.rs"
required-features = ["production-concurrency"]

[[example]]
name = "primary_history_distance_validation"
path = "examples/rust/id_history_distance_diagnostic.rs"
required-features = ["production-concurrency"]
