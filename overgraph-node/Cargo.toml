[package]
name = "overgraph-node"
version = "0.18.0"
edition = "2021"
description = "Node.js native addon for OverGraph"

[lib]
crate-type = ["cdylib"]

[dependencies]
overgraph = { path = "..", default-features = false }
napi = { version = "3", features = ["napi6", "serde-json"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[features]
default = ["production-concurrency"]
production-concurrency = ["overgraph/production-concurrency"]
binding-test-hooks = ["production-concurrency", "overgraph/binding-test-hooks"]
